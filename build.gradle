plugins {
    id 'org.jetbrains.kotlin.jvm' version "$kotlinVersion"
    id 'org.jetbrains.dokka' version "$dokkaVersion"
    id 'application'
}

repositories {
    mavenLocal()
    mavenCentral()
}

subprojects {
    group = projectGroup
    version = projectVersion

    apply plugin: 'kotlin'
    apply plugin: 'maven-publish'
    apply plugin: 'org.jetbrains.dokka'

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        implementation "$kotlinGroup:kotlin-reflect:$kotlinVersion"
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
    }

    test {
        useJUnitPlatform()
    }

    kotlin {
        jvmToolchain(jdkVersion.toInteger())
    }
}

tasks.register('releaseLocal', GradleBuild) {
    startParameter = gradle.startParameter.newInstance()
    tasks = ['clean', 'build', 'dokkaHtml', 'publishToMavenLocal']
}

tasks.register('releasePublic', GradleBuild) {
    startParameter = gradle.startParameter.newInstance()
    tasks = ['clean', 'build', 'dokkaHtml', 'publishToMavenLocal', 'publish']
}
