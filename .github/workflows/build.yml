name: Build

# Builds and verifies everything on JDK 25 (compile, tests, ABI, formatting, coverage),
# then runs the tests on the older JDKs that consumers may run: 17 (the bytecode target) and 21.

on:
  push:
    branches:
      - 'main'
      - 'release'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK 25)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: zulu
        java-version: 25
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - name: Build
      run: ./gradlew build

  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 21]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: zulu
        # The last version listed becomes JAVA_HOME; Gradle builds with 25 and tests with the matrix JDK.
        java-version: |
          ${{ matrix.jdk }}
          25
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - name: Test
      run: >-
        ./gradlew test
        -PtestJdk=${{ matrix.jdk }}
        -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.jdk }}_X64,JAVA_HOME_25_X64
