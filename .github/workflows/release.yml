name: Release

# Publishes every library to GitHub Packages when a version tag is pushed.
# The tag must point at a commit on the release branch and must match the version in gradle.properties.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: zulu
        # The last version listed becomes JAVA_HOME; Gradle builds with 25 and also tests with 17 and 21.
        java-version: |
          17
          21
          25

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Verify tag is on the release branch
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
          echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on the release branch."
          exit 1
        fi

    - name: Verify tag matches project version
      run: |
        version=$(sed -n 's/^version=//p' gradle.properties)
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match project version v$version."
          exit 1
        fi

    - name: Build
      run: ./gradlew build

    - name: Test on JDK 17 and 21
      run: |
        for jdk in 17 21; do
          ./gradlew test --rerun -PtestJdk=$jdk -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${jdk}_X64,JAVA_HOME_25_X64
        done

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: zulu
        java-version: 25

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    # The build's GitHubPackages repository reads GITHUB_ACTOR and GITHUB_TOKEN; no long-lived credentials are stored.
    - name: Publish to GitHub Packages
      run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
