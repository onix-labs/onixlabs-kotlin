name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - core
        - graph
        - graph-validation
        - graph-projection
        - scheduler
        - build or CI
        - new module
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work; a code sample of the API you have in mind is very welcome.
      render: kotlin
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
